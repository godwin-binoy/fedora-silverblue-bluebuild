context.properties = {
  default.clock.quantum = 1024
  default.clock.min-quantum = 512
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" },
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
