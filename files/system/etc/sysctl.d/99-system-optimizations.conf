# Memory / VM
vm.swappiness = 100
vm.page-cluster = 0
vm.dirty_background_ratio = 5
vm.dirty_ratio = 20
vm.dirty_writeback_centisecs = 6000
vm.dirty_expire_centisecs = 12000
vm.vfs_cache_pressure = 50

# Fix Proton game crashes and Electron OOM
vm.max_map_count = 1048576

# Fix VSCode/Flatpak CPU spikes from file watchers
fs.inotify.max_user_watches = 524288

# ZRAM Watermark Tuning
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Networking (BBR + fq verified optimal)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# Network buffers for Wi-Fi 7 / High Speed
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.netdev_max_backlog = 16384

# Allow intel_gpu_top to run without sudo
kernel.perf_event_paranoid = 1

# --- Security hardening ---
# Hide kernel pointers from unprivileged users (1 = restrict non-privileged)
kernel.kptr_restrict = 1
# Restrict dmesg access to privileged users
kernel.dmesg_restrict = 1
# Disable ICMP redirects (mitigate redirect/spoof attacks)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
