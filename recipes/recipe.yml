# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: fedora-silverblue-bluebuild
description: Hardware-optimized Fedora Silverblue for Intel Core Ultra (Meteor Lake / Arrow Lake / Lunar Lake)
base-image: ghcr.io/ublue-os/silverblue-main
image-version: "44"

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - rpmfusion.sh

  - type: dnf
    install:
      packages:
        # Video acceleration (VA-API / QuickSync) — Fedora official
        - libva-intel-media-driver
        - libva-utils
        - gstreamer1-vaapi
        # Full multimedia (from RPMFusion)
        - ffmpeg
        # GPU compute (verified exist in Fedora 44)
        - intel-opencl
        - intel-level-zero
        # NPU (verified exists in Fedora 44)
        - intel-npu-driver
        # Camera / MIPI support for Core Ultra
        - libcamera
        - libcamera-tools
        - pipewire-plugin-libcamera
        - intel-vsc-firmware
        # OneVPL runtime for QuickSync on Meteor Lake+
        - intel-vpl-gpu-rt
        # Power management
        - intel-lpmd
        # Diagnostics
        - igt-gpu-tools
        - fastfetch
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - gnome-tour
        - yelp
        - gnome-user-docs
        - rygel

  - type: kargs
    kargs:
      # CPU power management
      - intel_pstate=active
      # IOMMU (full DMA protection with pass-through to avoid I/O overhead)
      - intel_iommu=on
      - iommu=pt
      # THP (kernel-level, more reliable than tmpfiles.d)
      - transparent_hugepage=madvise
      # Boot UX
      - quiet
      - splash

  - type: systemd
    system:
      enabled:
        - thermald.service
        - tuned.service
        - systemd-oomd.service
        - intel_lpmd.service
        - fstrim.timer
        - flatpak-automatic-upgrade.timer
      masked: []

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.brave.Browser
          - com.mattjakeman.ExtensionManager

  - type: signing
